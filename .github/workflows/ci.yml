# CI — push/PR 마다 자동 실행되는 품질 검사 (fix_checklist 7순위 #35)
# 백엔드: pgvector 붙인 pytest + 커버리지 / 프론트: oxlint + vite build
#
# 2026-08-05 감사 반영 — 이전 CI 는 DB 가 없어 API·인증 테스트 15건이 실행되지
# 않았는데, 그 테스트들이 함수 안 `return` 으로 빠져나가 pytest 가 PASSED 로
# 집계했다. "138 passed" 초록불이 HTTP 계층을 한 번도 안 돌린 결과였다.
# 조치 2겹: ① 테스트에 skipif 마커를 달아 안 돈 것은 SKIPPED 로 보이게
#           ② 여기에 실제 DB 를 붙여 15건이 실제로 돌게 + 연결 실패 시 즉시 실패
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    # pgvector 포함 이미지 — db/schema.sql 이 CREATE EXTENSION vector 를 요구한다
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: national_assembly
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/national_assembly

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt -r scripts/requirements.txt
          pip install pytest pytest-cov httpx  # httpx: TestClient (API 테스트)

      # 코퍼스는 넣지 않는다 — API 테스트는 "스키마만 보장되면 200" 계약으로
      # 작성돼 있어(빈 사전·빈 결과 허용) 스키마만으로 계층 검증이 성립한다.
      - name: Prepare database schema
        run: |
          psql "$DATABASE_URL" -f db/schema.sql
          psql "$DATABASE_URL" -f db/indexes.sql

      # 연결이 깨지면 테스트가 조용히 전부 SKIPPED 로 지나간다 — 그 상태를
      # 초록불로 넘기지 않기 위해 여기서 먼저 끊는다 (거짓 초록불 재발 방지)
      - name: Verify DB reachable (skip 방지)
        run: |
          python -c "import sys; sys.path.insert(0, 'backend'); import db; db.init_pool(); print('DB 연결 OK')"

      # -rs: 건너뛴 테스트와 사유를 요약에 출력 — 조용한 skip 을 눈에 보이게
      - name: Run tests with coverage
        run: pytest tests/ -v -rs --cov=backend --cov=scripts --cov-report=term

      # continue-on-error: 취약점이 있으면 UI 에 경고로 남기되 빌드는 막지 않는다.
      # 이전의 `|| true` 는 결과와 무관하게 초록불이라 아무도 보지 않았다.
      - name: Dependency vulnerability scan
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt -r scripts/requirements.txt

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      # 위 pip-audit 과 같은 이유로 `|| true` → continue-on-error
      - name: Audit
        continue-on-error: true
        run: npm audit --omit=dev
      - name: Build
        run: npm run build
